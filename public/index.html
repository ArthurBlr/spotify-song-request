<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0617">
<title>Song request</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>Demande un titre</h1>
      <p class="lead">Cherche un morceau : il part dans la file d’attente.</p>
    </div>
    <div class="who">
      <p id="present" class="present" hidden></p>
      <button id="avatar-button" class="chip" type="button" hidden>
        <span id="avatar-mini" class="mini"></span>Mon avatar
      </button>
    </div>
  </header>

  <!-- Shown while the owner has not finished the installation. -->
  <section id="view-setup" class="card prose" hidden>
    <h2>Installation à terminer</h2>
    <div id="setup-body"></div>
  </section>

  <!-- Shown when an access code is required. -->
  <section id="view-code" class="card" hidden>
    <form id="code-form" class="code-form">
      <label for="code-input">Code d’accès</label>
      <div class="row">
        <input id="code-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button class="button" type="submit">Entrer</button>
      </div>
      <p id="code-error" class="error" hidden>Ce code n’est pas le bon.</p>
    </form>
  </section>

  <div id="view-main" hidden>
    <section class="card now" aria-labelledby="now-title">
      <h2 id="now-title" class="eyebrow">En cours de lecture</h2>
      <div class="now-row">
        <div id="now"></div>
        <div id="volume" class="volume" role="group" aria-label="Volume" hidden>
          <button id="volume-down" class="step" type="button" aria-label="Baisser le volume">−</button>
          <span id="volume-level" class="level"></span>
          <button id="volume-up" class="step" type="button" aria-label="Monter le volume">+</button>
        </div>
        <button id="skip" class="ghost" type="button" hidden></button>
      </div>
      <div id="progress" class="progress" hidden>
        <span id="progress-now" class="time"></span>
        <div id="progress-bar" class="bar" role="progressbar" aria-label="Avancement du titre" aria-valuemin="0">
          <div id="progress-fill" class="fill"></div>
        </div>
        <span id="progress-end" class="time"></span>
      </div>
      <!-- One button per reaction: a tap, and one's avatar says it in a bubble. -->
      <div id="reactions" class="reactions" role="group" aria-label="Réagir" hidden></div>
    </section>

    <!-- Narrow screens show one pane at a time; wide screens show both and hide these. -->
    <div class="tabs" role="group" aria-label="Affichage">
      <button type="button" data-tab="search" aria-pressed="true">Ajouter un titre</button>
      <button type="button" data-tab="queue" aria-pressed="false">File d’attente</button>
    </div>

    <div id="panes" class="panes" data-tab="search">
      <section id="pane-search" class="card pane" aria-labelledby="search-title">
        <h2 id="search-title" class="eyebrow">Ajouter un titre</h2>
        <form id="search-form" role="search">
          <label class="sr-only" for="q">Rechercher un titre</label>
          <input id="q" type="search" placeholder="Titre, artiste ou lien Spotify" autocomplete="off" enterkeyhint="search">
        </form>
        <div class="hints">
          <p id="status" class="hint" role="status"></p>
          <p id="cooldown" class="hint" hidden></p>
        </div>
        <ul id="results" class="tracks" aria-label="Résultats"></ul>
      </section>

      <section id="pane-queue" class="card pane" aria-labelledby="queue-title">
        <h2 id="queue-title" class="eyebrow">File d’attente</h2>
        <ul id="next" class="tracks compact"></ul>
        <p id="next-empty" class="empty">Aucun titre en attente.</p>
      </section>
    </div>
  </div>
</main>

<!-- One small character per person on the page, strolling along the bottom of the screen
     and saying their reactions. -->
<div id="crowd" class="crowd" aria-hidden="true"></div>

<dialog id="avatar-dialog" class="card dialog" aria-labelledby="avatar-title">
  <form id="avatar-form">
    <h2 id="avatar-title" class="eyebrow">Mon avatar</h2>
    <div class="avatar-top">
      <div id="avatar-preview" class="preview"></div>
      <label class="field">
        Pseudo, visible par tous
        <input id="avatar-name" type="text" maxlength="16" autocomplete="off" placeholder="Facultatif">
      </label>
    </div>
    <fieldset>
      <legend>Style</legend>
      <div id="avatar-style" class="choices"></div>
    </fieldset>
    <fieldset>
      <legend>Couleur</legend>
      <div id="avatar-color" class="choices"></div>
    </fieldset>
    <fieldset>
      <legend>Forme</legend>
      <div id="avatar-body" class="choices"></div>
    </fieldset>
    <fieldset>
      <legend>Accessoire</legend>
      <div id="avatar-extra" class="choices"></div>
    </fieldset>
    <div class="row">
      <button id="avatar-cancel" class="ghost" type="button">Annuler</button>
      <button class="button" type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
